<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | GameHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top site-nav">
            <div class="container">
                <a class="navbar-brand" href="index.html">Game<span class="accent">Hub</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="games.html">Games</a></li>
                        <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                    <button id="theme-btn" class="btn btn-sm btn-outline-light ms-lg-3" type="button">Light mode</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container my-5">
            <h1 class="section-title">Contact Us</h1>
            <form class="contact-form" id="contact-form" action="#" method="post" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name">
                    <div class="invalid-feedback" id="name-error"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email">
                    <div class="invalid-feedback" id="email-error"></div>
                </div>
                <div class="mb-3">
                    <label for="topic" class="form-label">Topic</label>
                    <select class="form-select" id="topic">
                        <option value="">Choose a topic...</option>
                        <option>Game suggestion</option>
                        <option>Tournament registration</option>
                        <option>Other</option>
                    </select>
                    <div class="invalid-feedback" id="topic-error"></div>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" rows="4"></textarea>
                    <div class="invalid-feedback" id="message-error"></div>
                </div>
                <button type="submit" class="btn btn-accent">Send</button>
            </form>
            <div id="form-success" class="alert alert-success mt-3" style="display: none;">Thank you! Your message was sent.</div>
        </section>
    </main>

    <footer class="site-footer py-4 mt-5">
        <div class="container footer-flex">
            <p class="mb-0">&copy; 2026 GameHub. Midterm project by Azat Zholdygali, group SE-2526.</p>
            <p class="mb-0"><a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="contact.html">Contact</a></p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
