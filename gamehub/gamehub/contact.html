<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | GameHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top site-nav">
            <div class="container">
                <a class="navbar-brand" href="index.html">Game<span class="accent">Hub</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="games.html">Games</a></li>
                        <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container my-5">
            <h1 class="section-title">Contact Us</h1>
            <form class="contact-form" action="#" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="topic" class="form-label">Topic</label>
                    <select class="form-select" id="topic">
                        <option>Game suggestion</option>
                        <option>Tournament question</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="msg" class="form-label">Message</label>
                    <textarea class="form-control" id="msg" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-accent">Send</button>
            </form>
        </section>
    </main>

    <footer class="site-footer py-4 mt-5">
        <div class="container footer-flex">
            <p class="mb-0">&copy; 2026 GameHub. Midterm project by Azat Zholdygali, group SE-2526.</p>
            <p class="mb-0"><a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="contact.html">Contact</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
